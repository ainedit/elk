filebeat.inputs:
  - type: log
    id: app-logs
    enabled: true
    paths:
      - /logs/application.log

    # Si prefieres hacer el multiline en Filebeat en vez de Logstash, podrías usar:
    multiline.pattern: '^(DEBUG|INFO|ERROR|TRACE|FATAL|WARN).*'
    multiline.negate: true
    multiline.match: after

output.logstash:
  hosts: ["logstash:5044"]
